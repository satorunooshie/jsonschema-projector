name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of jsonschema-projector version or the commit SHA.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest schema, config, and command that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
